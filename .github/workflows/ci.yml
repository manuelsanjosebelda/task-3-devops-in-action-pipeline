name: TaskFlow CI

on:
  push:
    branches:
      - feature/**
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build
