# TaskFlow Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskflow

spec:
  replicas: 3

  selector:
    matchLabels:
      app: taskflow

  template:
    metadata:
      labels:
        app: taskflow

    spec:
      # Apply security settings to the Pod
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: taskflow
          image: taskflow:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          # Container security settings
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL

          # Writable directories required by Nginx
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

          # Check whether the application is healthy
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          # Check whether the application is ready to receive traffic
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

      # Temporary writable storage
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
